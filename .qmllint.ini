; Settings for qmllint, which the Static analysis CI workflow runs over every .qml file with
; the qmllint of Qt 6.7. Categories that are not listed keep their default level.

[Warnings]
; qmllint cannot resolve the QAccelPlot types yet: property types are registered with a leading
; "::QAccelPlot::", ColorPalette is not exposed to QML, and the examples load their shared
; components from resources instead of a QML module. The categories below only report the
; consequences, about 1250 warnings in total, so they stay off until the types resolve.
ImportFailure=disable
UnresolvedType=disable
MissingType=disable
MissingProperty=disable
BadSignalHandlerParameters=disable
RequiredProperty=disable
; Qualifying every access needs "pragma ComponentBehavior: Bound", which Qt 6.2 does not have.
UnqualifiedAccess=disable
