name: Static analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Every other run gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: bash .github/scripts/apt_install.sh clang-format-19

      # The file-count check guards against the pattern silently matching nothing.
      - name: Check formatting
        shell: bash
        run: |
          git ls-files '*.cpp' '*.hpp' > sources.txt
          echo "Checking $(wc -l < sources.txt) files"
          test -s sources.txt
          xargs clang-format-19 --dry-run --Werror < sources.txt

  # .qmllint.ini selects the categories; the ones that need the QAccelPlot types are off.
  qmllint:
    name: qmllint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          target: desktop
          modules: qtshadertools
          cache: true
          setup-python: false

      # The file-count check guards against the pattern silently matching nothing.
      - name: Run qmllint
        shell: bash
        run: |
          git ls-files '*.qml' > qml-files.txt
          echo "Checking $(wc -l < qml-files.txt) files"
          test -s qml-files.txt
          xargs qmllint < qml-files.txt

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: bash .github/scripts/apt_install.sh clang-19 clang-tidy-19 cmake ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          target: desktop
          modules: qtshadertools
          cache: true
          setup-python: false

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DQACCELPLOT_BUILD_TESTS=OFF
          -DQACCELPLOT_BUILD_EXAMPLES=OFF

      # Building the library produces the moc, QML type registration, and
      # shader outputs that the analyzed sources include.
      - name: Build library
        run: cmake --build build --parallel --target QAccelPlot

      # .clang-tidy sets WarningsAsErrors, so any finding fails this step.
      # The file-count check guards against the pattern silently matching nothing.
      - name: Run clang-tidy
        shell: bash
        run: |
          run-clang-tidy-19 -p build -clang-tidy-binary clang-tidy-19 -quiet \
            'QAccelPlot/src/QAccelPlot/.*\.cpp$' | tee clang-tidy.log
          grep -Eq '^Running clang-tidy for [1-9][0-9]* files' clang-tidy.log
