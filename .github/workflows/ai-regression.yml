name: Visual Acceptance

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Basic visual acceptance — PR #{0}', github.event.pull_request.number)
      || inputs.ai_mode == 'off'
      && 'Basic visual acceptance — manual run'
      || format('AI visual acceptance — {0}', inputs.ai_mode) }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ai_mode:
        description: Paid AI review mode
        type: choice
        default: representative
        options:
          - representative
          - full
          - off
      base_ref:
        description: Base branch for selecting representative examples (representative mode only)
        type: string
        default: main

jobs:
  detect-impact:
    name: Determine visual review scope
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.impact.outputs.scope }}
      examples: ${{ steps.impact.outputs.examples }}
      changed_count: ${{ steps.impact.outputs.changed_count }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: impact
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || format('origin/{0}', inputs.base_ref) }}
        run: python .github/scripts/ai_visual_impact.py --base "$BASE_REF" --github-output "$GITHUB_OUTPUT"

      - name: Summarize visual review scope
        env:
          SCOPE: ${{ steps.impact.outputs.scope }}
          EXAMPLES: ${{ steps.impact.outputs.examples }}
          CHANGED_COUNT: ${{ steps.impact.outputs.changed_count }}
        run: |
          echo "### Visual review scope" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed files: $CHANGED_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "Scope: $SCOPE" >> "$GITHUB_STEP_SUMMARY"
          echo "Examples: ${EXAMPLES:-none}" >> "$GITHUB_STEP_SUMMARY"

  all-examples-rhi:
    name: Capture & validate / Qt ${{ matrix.qt_version }} / ${{ matrix.platform.backend }} / ${{ matrix.platform.os }}
    needs: detect-impact
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        qt_version:
          - '6.2.4'
          - '6.8.3'
          - '6.11.2'
        platform:
          - os: ubuntu-24.04
            backend: opengl
            prefer_software_device: '0'
            force_mesa_software: '1'
          - os: ubuntu-24.04
            backend: vulkan
            # GitHub-hosted runners have no GPU. This keeps the Vulkan RHI but selects Mesa lavapipe.
            prefer_software_device: '1'
            force_mesa_software: '0'
          - os: windows-2025
            backend: d3d11
            # This keeps the D3D11 RHI but selects Microsoft's WARP software adapter.
            prefer_software_device: '1'
            force_mesa_software: '0'
          - os: windows-2025
            backend: d3d12
            # This keeps the D3D12 RHI but selects Microsoft's WARP software adapter.
            prefer_software_device: '1'
            force_mesa_software: '0'
          - os: macos-15
            backend: metal
            prefer_software_device: '0'
            force_mesa_software: '0'
        # Qt Quick's D3D12 RHI was introduced in Qt 6.6.
        exclude:
          - qt_version: '6.2.4'
            platform:
              os: windows-2025
              backend: d3d12
              prefer_software_device: '1'
              force_mesa_software: '0'
    env:
      QSG_RHI_BACKEND: ${{ matrix.platform.backend }}
      QACCELPLOT_EXPECTED_GRAPHICS_API: ${{ matrix.platform.backend }}
      QACCELPLOT_EXPECTED_QT_VERSION: ${{ matrix.qt_version }}
      QSG_RHI_PREFER_SOFTWARE_RENDERER: ${{ matrix.platform.prefer_software_device }}
      LIBGL_ALWAYS_SOFTWARE: ${{ matrix.platform.force_mesa_software }}
      QSG_RENDER_LOOP: basic
      # Hosted Windows and macOS desktops expose only about 1024px of logical
      # width. This keeps windows visible; screenshots are rendered separately
      # into full-resolution offscreen targets by the example capture helper.
      QT_SCALE_FACTOR: ${{ matrix.platform.os == 'ubuntu-24.04' && '1' || '0.5' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Qt
        if: runner.os != 'Windows' || matrix.qt_version != '6.11.2'
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ matrix.qt_version }}
          target: desktop
          modules: qtshadertools
          cache: true
          setup-python: false

      # aqtinstall 3.3 assumes qt6_6112/qt6_6112 on Windows, but Qt 6.11
      # moved each architecture into its own repository directory.
      # Upstream: https://github.com/miurahr/aqtinstall/issues/1007
      - name: Cache Qt 6.11.2 on Windows
        if: runner.os == 'Windows' && matrix.qt_version == '6.11.2'
        id: cache-qt-6112-windows
        uses: actions/cache@v5
        with:
          path: Qt/6.11.2/msvc2022_64
          key: qt-6.11.2-windows-msvc2022-64-aqt-layout-v1

      - name: Install Qt 6.11.2 on Windows
        if: runner.os == 'Windows' && matrix.qt_version == '6.11.2' && steps.cache-qt-6112-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==3.3.0" "py7zr==1.1.*"
          $installArgs = @(
            '.github/scripts/aqt_windows_qt611.py',
            'install-qt', 'windows', 'desktop', '6.11.2', 'win64_msvc2022_64',
            '--outputdir', 'Qt', '--modules', 'qtshadertools'
          )
          & python @installArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Qt 6.11.2 installation failed; cleaning the partial install and retrying once.'
            Remove-Item -Recurse -Force 'Qt/6.11.2' -ErrorAction SilentlyContinue
            & python @installArgs
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure Qt 6.11.2 environment on Windows
        if: runner.os == 'Windows' && matrix.qt_version == '6.11.2'
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:GITHUB_WORKSPACE 'Qt\6.11.2\msvc2022_64'
          if (-not (Test-Path -LiteralPath "$qtRoot\bin\qtpaths.exe")) {
            throw "Qt installation is incomplete: $qtRoot"
          }
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtRoot\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_PLUGIN_PATH=$qtRoot\plugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QML2_IMPORT_PATH=$qtRoot\qml" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Vulkan runtime
        if: runner.os == 'Linux' && matrix.platform.backend == 'vulkan'
        run: sudo apt-get install --yes libvulkan1 libvulkan-dev mesa-vulkan-drivers vulkan-tools

      - name: Inspect Vulkan runtime
        if: runner.os == 'Linux' && matrix.platform.backend == 'vulkan'
        run: vulkaninfo --summary

      - name: Configure CMake (Linux and macOS)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQACCELPLOT_BUILD_TESTS=ON
          -DQACCELPLOT_BUILD_BENCHMARKS=OFF
          -DQACCELPLOT_DEPLOY_EXAMPLES=OFF
          -DQACCELPLOT_INSTALL=OFF

      - name: Configure CMake (Windows, Qt 6.2)
        if: runner.os == 'Windows' && matrix.qt_version == '6.2.4'
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -T v142
          -DQACCELPLOT_BUILD_TESTS=ON
          -DQACCELPLOT_BUILD_BENCHMARKS=OFF
          -DQACCELPLOT_DEPLOY_EXAMPLES=OFF
          -DQACCELPLOT_INSTALL=OFF

      - name: Configure CMake (Windows, Qt 6.8+)
        if: runner.os == 'Windows' && matrix.qt_version != '6.2.4'
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          -DQACCELPLOT_BUILD_TESTS=ON
          -DQACCELPLOT_BUILD_BENCHMARKS=OFF
          -DQACCELPLOT_DEPLOY_EXAMPLES=OFF
          -DQACCELPLOT_INSTALL=OFF

      - name: Build all examples
        run: cmake --build build --config Release --target QAccelPlotExamples --parallel 4

      - name: Capture every example (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure -L visual-smoke

      - name: Capture every example (Windows and macOS)
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure -L visual-smoke

      - name: Validate every screenshot and contract
        run: ctest --test-dir build -C Release --output-on-failure -L visual-validation

      - name: Upload visual acceptance artifacts
        if: always()
        id: upload-visual-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: visual-${{ matrix.qt_version }}-${{ matrix.platform.backend }}-${{ matrix.platform.os }}
          if-no-files-found: error
          overwrite: true
          path: |
            build/examples/test/screenshots/
            build/Testing/Temporary/LastTest.log

      - name: Add visual artifact link to job summary
        if: always() && steps.upload-visual-artifacts.outputs.artifact-url != ''
        shell: bash
        run: |
          echo "### Visual acceptance artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download screenshots](${{ steps.upload-visual-artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  bundle-screenshots:
    name: Bundle all visual screenshots
    needs: all-examples-rhi
    if: always() && needs.all-examples-rhi.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download matrix screenshot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: visual-*
          path: visual-artifacts

      - name: Collect screenshots by matrix configuration
        shell: bash
        run: |
          for artifact_dir in visual-artifacts/visual-*; do
            artifact_name="$(basename "$artifact_dir")"
            destination="all-visual-screenshots/$artifact_name/screenshots"
            mkdir -p "$destination"
            find "$artifact_dir" -type f -path '*/screenshots/*' -exec cp '{}' "$destination/" \;
          done

      - name: Upload combined screenshot artifact
        id: upload-combined-screenshots
        uses: actions/upload-artifact@v7
        with:
          name: all-visual-screenshots
          if-no-files-found: error
          overwrite: true
          path: all-visual-screenshots/

      - name: Add combined artifact link to job summary
        if: steps.upload-combined-screenshots.outputs.artifact-url != ''
        run: |
          echo "### Combined visual screenshots" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download every matrix screenshot](${{ steps.upload-combined-screenshots.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  ai-judge:
    name: Optional AI visual acceptance
    needs:
      - detect-impact
      - bundle-screenshots
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.ai_mode != 'off' &&
      needs.detect-impact.result == 'success' &&
      needs.bundle-screenshots.result == 'success' &&
      (inputs.ai_mode == 'full' || needs.detect-impact.outputs.scope != 'none')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      AI_VISUAL_MODEL: gpt-5.4-nano
      AI_VISUAL_INPUT_PRICE_USD_PER_MILLION: '0.20'
      AI_VISUAL_CACHED_INPUT_PRICE_USD_PER_MILLION: '0.02'
      AI_VISUAL_OUTPUT_PRICE_USD_PER_MILLION: '1.25'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install AI review dependencies
        run: pip install openai Pillow

      - name: Download combined screenshots
        uses: actions/download-artifact@v8
        with:
          name: all-visual-screenshots
          path: visual-artifacts

      - name: Review selected renders with AI
        env:
          AI_MODE: ${{ inputs.ai_mode }}
          AI_EXAMPLES: ${{ inputs.ai_mode == 'full' && 'all' || needs.detect-impact.outputs.examples }}
        run: >-
          python examples/test/visual/ai_visual_matrix.py
          --artifacts visual-artifacts
          --contracts examples/test/visual/contracts
          --reports visual-reports
          --summary visual-reports/summary.md
          --mode "$AI_MODE"
          --examples "$AI_EXAMPLES"
          --max-requests 24

      - name: Add AI cost summary
        if: always()
        run: |
          if [ -f visual-reports/summary.md ]; then
            cat visual-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload AI reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-visual-reports
          if-no-files-found: warn
          overwrite: true
          path: visual-reports/
