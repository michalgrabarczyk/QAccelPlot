name: Build, examples, and unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Qt private API ${{ matrix.qt_private_api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt_private_api: ['ON', 'OFF']

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build xvfb libgl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          target: desktop
          modules: qtshadertools
          cache: true
          setup-python: false

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQACCELPLOT_BUILD_TESTS=ON
          -DQACCELPLOT_BUILD_EXAMPLES=ON
          -DQACCELPLOT_BUILD_BENCHMARKS=OFF
          -DQACCELPLOT_INSTALL=ON
          -DQACCELPLOT_USE_QT_PRIVATE_API=${{ matrix.qt_private_api }}

      - name: Build library, examples, and unit tests
        run: >-
          cmake --build build --config Release --parallel 2 --target
          QAccelPlotExamples
          QAccelPlotTests

      - name: Run unit tests
        run: >-
          xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          -L '^unit-test$'

  opengl-es:
    # Embedded Linux devices render through OpenGL ES, so every example must run on an ES 3.0
    # context. Mesa's software renderer provides one on both x86_64 and ARM64 hosted runners.
    name: OpenGL ES 3.0 / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: arm64
            os: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    env:
      QT_VERSION: '6.8.3'
      QACCELPLOT_OPENGL_ES_VERSION: '3.0'
      QACCELPLOT_EXPECTED_GRAPHICS_API: opengl
      QACCELPLOT_EXPECTED_QT_VERSION: '6.8.3'
      QSG_RHI_BACKEND: opengl
      QSG_RENDER_LOOP: basic
      QT_SCALE_FACTOR: '1'
      # GLX cannot create OpenGL ES contexts; EGL can, even with a desktop OpenGL Qt build.
      QT_XCB_GL_INTEGRATION: xcb_egl
      LIBGL_ALWAYS_SOFTWARE: '1'
      # Mesa llvmpipe offers OpenGL ES 3.2; cap it at the minimum QAccelPlot supports.
      MESA_GLES_VERSION_OVERRIDE: '3.0'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build xvfb libgl1-mesa-dev libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtshadertools
          cache: true
          setup-python: false

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQACCELPLOT_BUILD_TESTS=ON
          -DQACCELPLOT_BUILD_EXAMPLES=ON
          -DQACCELPLOT_BUILD_VISUAL_TESTS=ON
          -DQACCELPLOT_BUILD_BENCHMARKS=OFF
          -DQACCELPLOT_DEPLOY_EXAMPLES=OFF
          -DQACCELPLOT_INSTALL=OFF

      - name: Build library, examples, and unit tests
        run: cmake --build build --config Release --parallel 4 --target QAccelPlotExamples QAccelPlotTests

      - name: Run unit tests
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure -L '^unit-test$'

      - name: Capture every example with OpenGL ES
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure -L visual-smoke

      - name: Validate every screenshot and its OpenGL ES context
        run: ctest --test-dir build -C Release --output-on-failure -L visual-validation

      - name: Upload OpenGL ES screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opengl-es-${{ env.QT_VERSION }}-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            build/examples/test/screenshots/
            build/Testing/Temporary/LastTest.log
