#
# Each night Claude runs the improve-codebase-architecture skill from mattpocock/skills,
# implements the top finding, and opens a pull request labeled nightly-architecture.
# The prompt is .github/prompts/nightly-architecture.md.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY  Claude authentication (one is enough).
#   NIGHTLY_PR_TOKEN (optional)                   Token that opens the pull request. Pull requests
#                                                 opened with GITHUB_TOKEN don't start CI, so
#                                                 use a fine-grained token with Contents and
#                                                 Pull requests write access to get CI runs.
name: Nightly architecture review

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: Module, subsystem, or pain point to look at (empty infers it from history)
        required: false
        default: ''
      force:
        description: Run even when a nightly-architecture pull request is still open
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  LABEL: nightly-architecture
  OUT_DIR: .nightly-architecture

jobs:
  # One review at a time: a new pull request waits until the previous one is merged or closed.
  gate:
    name: Check for an open nightly pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq length)
          if [ "$open" -gt 0 ] && [ "$FORCE" != "true" ]; then
            echo "::notice::A $LABEL pull request is still open; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Claude works with a read-only token; the open-pr job does the writing.
  review:
    name: Review and implement
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: >-
          bash .github/scripts/apt_install.sh build-essential cmake ninja-build xvfb
          libgl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0 clang-format-19

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          target: desktop
          modules: qtshadertools
          cache: true
          setup-python: false

      # A warm build lets Claude spend its turns on the change rather than the first build.
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQACCELPLOT_BUILD_TESTS=ON \
            -DQACCELPLOT_BUILD_EXAMPLES=ON \
            -DQACCELPLOT_FORCE_ASSERTS=ON \
            -DQACCELPLOT_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 4

      - name: Prepare prompt
        id: prompt
        env:
          FOCUS: ${{ inputs.focus }}
        run: |
          mkdir -p "$OUT_DIR"
          echo "$OUT_DIR/" >> .git/info/exclude
          {
            echo 'text<<PROMPT_EOF'
            echo '/mattpocock-skills:improve-codebase-architecture Run unattended under the rules below.'
            python3 - <<'PY'
          import os
          text = open(".github/prompts/nightly-architecture.md", encoding="utf-8").read()
          text = text.split("-->", 1)[1].strip()
          print(text.replace("{{FOCUS}}", os.environ.get("FOCUS", "").replace("`", "'")))
          PY
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/mattpocock/skills.git
          plugins: mattpocock-skills@mattpocock
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --effort medium
            --max-turns 400
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,Agent,Task,TodoWrite,Bash(cmake:*),Bash(ctest:*),Bash(xvfb-run:*),Bash(clang-format-19:*),Bash(python3 scripts/check-source-text.py),Bash(git log:*),Bash(git diff:*),Bash(git status:*),Bash(git show:*),Bash(git ls-files:*),Bash(git grep:*),Bash(git blame:*),Bash(git restore:*),Bash(git clean:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(ls:*),Bash(find:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(mkdir:*),Bash(date:*)"

      - name: Collect the change
        id: patch
        run: |
          git add -A
          git diff --cached --binary > "$OUT_DIR/change.patch"
          if [ -s "$OUT_DIR/change.patch" ] && [ -s "$OUT_DIR/pr-title.txt" ] && [ ! -e "$OUT_DIR/skip.md" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            if [ -s "$OUT_DIR/skip.md" ]; then
              cat "$OUT_DIR/skip.md" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No change and no skip.md were produced." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload report and change
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-architecture
          path: ${{ env.OUT_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  open-pr:
    name: Open pull request
    needs: review
    if: needs.review.outputs.has_patch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.NIGHTLY_PR_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: nightly-architecture
          path: ${{ runner.temp }}/nightly

      - name: Commit, push, and open the pull request
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_PR_TOKEN || github.token }}
          IN: ${{ runner.temp }}/nightly
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git apply --index "$IN/change.patch"

          # The review job can't be trusted to leave CI alone.
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "::error::The change edits .github/; refusing to open a pull request."
            git diff --cached --name-only
            exit 1
          fi

          branch="dev/nightly-architecture-$(date -u +%Y-%m-%d)"
          title=$(head -n 1 "$IN/pr-title.txt")
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898341+github-actions[bot]@users.noreply.github.com' \
              commit -m "$title"
          git push --force-with-lease origin "$branch"

          cp "$IN/pr-body.md" body.md
          printf '\n---\nNightly architecture review: [run and HTML report](%s)\n' "$RUN_URL" >> body.md

          gh label create "$LABEL" --color 5319E7 \
            --description 'Opened by the nightly architecture review' 2>/dev/null || true
          gh pr create --base main --head "$branch" --title "$title" \
            --body-file body.md --label "$LABEL"
