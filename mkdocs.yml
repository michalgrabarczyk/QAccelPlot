site_name: !ENV [QACCELPLOT_DOCS_TITLE, QAccelPlot Documentation]
site_description: User guide and API documentation for QAccelPlot
site_url: https://michalgrabarczyk.github.io/QAccelPlot/
repo_url: https://github.com/michalgrabarczyk/QAccelPlot
repo_name: michalgrabarczyk/QAccelPlot
edit_uri: ""

docs_dir: docs/guide
site_dir: build/site

theme:
  name: material
  language: en
  custom_dir: docs/guide/overrides
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdoxy:
      doxygen-bin-path: !ENV [QACCELPLOT_DOXYGEN, doxygen]
      projects:
        QAccelPlot:
          src-dirs: QAccelPlot/src
          api-path: api
          full-doc: true
          template-dir: docs/mkdoxy-templates
          doxy-cfg:
            PROJECT_NAME: QAccelPlot
            PROJECT_NUMBER: !ENV [QACCELPLOT_DOCS_VERSION, main]
            PROJECT_BRIEF: High-performance Qt Quick plotting library
            FILE_PATTERNS: "*.hpp *.h *.dox"
            RECURSIVE: true
            CASE_SENSE_NAMES: true
            EXCLUDE_PATTERNS: "*/shaders/* */moc_* *_p.hpp"
            QT_AUTOBRIEF: true
            JAVADOC_AUTOBRIEF: false
            EXTRACT_ALL: false
            EXTRACT_PRIVATE: false
            EXTRACT_STATIC: true
            HIDE_UNDOC_MEMBERS: false
            HIDE_UNDOC_CLASSES: false
            SOURCE_BROWSER: false
            VERBATIM_HEADERS: false
            WARN_IF_UNDOCUMENTED: true
            WARN_IF_DOC_ERROR: true
            WARN_NO_PARAMDOC: false
            WARN_AS_ERROR: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts and architecture: concepts.md
  - Performance: performance.md
  - Performance comparison: performance-comparison.md
  - Cookbook:
      - cookbook/index.md
      - Basic static plot: cookbook/basic-plot.md
      - Real-time scrolling data: cookbook/realtime.md
      - Axis formats: cookbook/axis-formats.md
      - Multiple axes: cookbook/multiple-axes.md
      - Styling and transitions: cookbook/styling.md
      - Annotations and tools: cookbook/annotations.md
      - Background data production: cookbook/background-data.md
  - Changelog: changelog.md
  - Versioning and releases: versioning.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - API reference:
      - Overview: api.md
      - Class list: api/annotated.md
      - Class index: api/classes.md
      - Class hierarchy: api/hierarchy.md
      - Namespaces: api/namespaces.md
      - Files: api/files.md

copyright: Copyright &copy; 2026 Michal Grabarczyk

extra:
  generator: false
  docs_version: !ENV [QACCELPLOT_DOCS_VERSION, main]
  docs_channel: !ENV [QACCELPLOT_DOCS_CHANNEL, development]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/michalgrabarczyk/QAccelPlot
