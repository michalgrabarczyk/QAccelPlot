site_name: !ENV [QACCELPLOT_DOCS_TITLE, QAccelPlot Documentation]
site_description: User guide and API documentation for QAccelPlot
site_url: https://michalgrabarczyk.github.io/QAccelPlot/
repo_url: https://github.com/michalgrabarczyk/QAccelPlot
repo_name: michalgrabarczyk/QAccelPlot
edit_uri: ""

docs_dir: docs/guide
site_dir: build/site

theme:
  name: material
  language: en
  custom_dir: docs/guide/overrides
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Doxygen pages are added after MkDocs renders the guide, so MkDocs cannot see
# those relative targets during its validation pass.
validation:
  links:
    not_found: ignore

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts and architecture: concepts.md
  - Performance: performance.md
  - Performance comparison: performance-comparison.md
  - Cookbook:
      - cookbook/index.md
      - Basic static plot: cookbook/basic-plot.md
      - Real-time scrolling data: cookbook/realtime.md
      - Axis formats: cookbook/axis-formats.md
      - Multiple axes: cookbook/multiple-axes.md
      - Styling and transitions: cookbook/styling.md
      - Annotations and tools: cookbook/annotations.md
      - Background data production: cookbook/background-data.md
  - Changelog: changelog.md
  - Versioning and releases: versioning.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - API reference: api.md

copyright: Copyright &copy; 2026 Michal Grabarczyk

extra:
  generator: false
  docs_version: !ENV [QACCELPLOT_DOCS_VERSION, main]
  docs_channel: !ENV [QACCELPLOT_DOCS_CHANNEL, development]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/michalgrabarczyk/QAccelPlot
